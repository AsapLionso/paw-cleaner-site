<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Même silhouette que IconPaw dans l'app RN (src/components/icons.tsx)
       — coussinet + 4 doigts, même dégradé radial "shine" — pour que le
       curseur du site et l'icône patte de l'app restent visuellement le
       même symbole de marque. -->
  <defs>
    <radialGradient id="pawShine" cx="35%" cy="28%" r="85%">
      <stop offset="0%" stop-color="#ededed" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ededed" stop-opacity="0.5"/>
    </radialGradient>
  </defs>
  <ellipse cx="12" cy="16.4" rx="5.6" ry="4.6" fill="url(#pawShine)"/>
  <circle cx="6.6" cy="10.3" r="2.1" fill="url(#pawShine)"/>
  <circle cx="9.9" cy="6.8" r="2.3" fill="url(#pawShine)"/>
  <circle cx="14.1" cy="6.8" r="2.3" fill="url(#pawShine)"/>
  <circle cx="17.4" cy="10.3" r="2.1" fill="url(#pawShine)"/>
</svg>
